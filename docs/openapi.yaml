      security:
        - bearerAuth: []
      parameters:
        - name: SubscriptionId
          in: path
          required: true
          description: The Subscription ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Subscription
