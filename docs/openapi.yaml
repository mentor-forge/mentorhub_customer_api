openapi: 3.0.3
info:
  title: Mentor Hub customer API
  description: |
    A Flask + MongoDB API for the customer service.
    
    ## Authentication
    All endpoints (except `/metrics`) require JWT authentication via the `Authorization` header:
    ```
    Authorization: Bearer <token>
    ```
    
    For local development, obtain a JWT from the Developer Edition welcome / IdP flow, or use a
    test token from `test/e2e/e2e_auth.py` that matches your `JWT_SECRET` and expected claims.
  version: 0.1.0
  contact:
    name: Mentor Forge
    email: info@agile-learning-institute.com
  license:
    name: Apache-2.0

servers:
  - url: http://localhost:8387
    description: Local development server

tags:
  - name: Config
    description: Configuration endpoints
  - name: Event
    description: Event operations (create, read)
  - name: Profile
    description: Profile operations (read-only)
  - name: Customer
    description: Customer operations (read-only)
  - name: Journey
    description: Journey operations (read-only)
  - name: Rating
    description: Rating operations (read-only)
  - name: Note
    description: Note operations (read-only)
paths:
  /api/config:
    get:
      tags:
        - Config
      summary: Get configuration
      description: Returns the current configuration as JSON (requires authentication)
      operationId: getConfig
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Configuration retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  config_items:
                    type: array
                    items:
                      type: object
                  versions:
                    type: array
                    items:
                      type: object
                  enumerators:
                    type: array
                    items:
                      type: object
                  token:
                    type: object
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics:
    get:
      tags:
        - Metrics
      summary: Prometheus metrics
      description: Returns Prometheus-formatted metrics
      operationId: getMetrics
      responses:
        '200':
          description: Metrics retrieved successfully
          content:
            text/plain:
              schema:
                type: string

  /api/Event:
    get:
      tags:
        - Event
      summary: Get all Event documents
      description: Retrieve a paginated list of Event documents
      operationId: getEvents
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: header
          required: false
          description: Pagination offset (number of records to skip)
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: header
          required: false
          description: Pagination size (maximum records to return, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: profile_id
          in: query
          required: false
          description: Filter events by profile ID
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
        - name: type
          in: query
          required: false
          description: Filter events by type
          schema:
            type: string
            enum:
              - advanced
              - arrived
              - completed
              - encounter
              - external_received
              - fail
              - identity_provisioned
              - invite_accepted
              - invite_created
              - link
              - login
              - logout
              - note
              - notification_created
              - notification_dismissed
              - organization_enriched
              - payment_recorded
              - profile_redacted
              - started
              - subscription_changed
        - name: sort_by
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum:
              - type
              - created.at_time
            default: created.at_time
            example: created.at_time
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
            example: desc
      responses:
        '200':
          description: Successfully retrieved Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Event
      summary: Create a new Event document
      description: Create a new Event document (requires staff or admin role)
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                    pattern: '^[0-9a-fA-F]{24}$'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/Event/{EventId}:
    get:
      tags:
        - Event
      summary: Get Event by EventId
      description: Retrieve a specific Event document by its EventId
      operationId: getEvent
      security:
        - bearerAuth: []
      parameters:
        - name: EventId
          in: path
          required: true
          description: The Event ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/Profile:
    get:
      tags:
        - Profile
      summary: Get all Profile documents
      description: Retrieve a paginated list of Profile documents (read-only)
      operationId: getProfiles
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: header
          required: false
          description: Pagination offset (number of records to skip)
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: header
          required: false
          description: Pagination size (maximum records to return, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: name
          in: query
          required: false
          description: Optional name filter (supports partial matches, case-insensitive)
          schema:
            type: string
            example: my-Profile
        - name: full_name
          in: query
          required: false
          description: Optional full name filter (supports partial matches, case-insensitive)
          schema:
            type: string
        - name: email
          in: query
          required: false
          description: Optional email filter (supports partial matches, case-insensitive)
          schema:
            type: string
        - name: description
          in: query
          required: false
          description: Optional description filter (supports partial matches, case-insensitive)
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Optional status filter
          schema:
            type: string
            enum: [active, archived, provisioned, suspended]
        - name: roles
          in: query
          required: false
          description: Optional role filter
          schema:
            type: string
        - name: sort_by
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum: [name, full_name, email, status, created.at_time, saved.at_time]
            default: name
            example: name
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
            example: asc
      responses:
        '200':
          description: Successfully retrieved Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/Customer:
    get:
      tags:
        - Customer
      summary: Get all Customer documents
      description: Retrieve a paginated list of Customer documents (read-only)
      operationId: getCustomers
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: header
          required: false
          description: Pagination offset (number of records to skip)
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: header
          required: false
          description: Pagination size (maximum records to return, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: name
          in: query
          required: false
          description: Optional name filter (supports partial matches, case-insensitive)
          schema:
            type: string
            example: my-Customer
        - name: sort_by
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum: [name, description]
            default: name
            example: name
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
            example: asc
      responses:
        '200':
          description: Successfully retrieved Customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/Rating:
    get:
      tags:
        - Rating
      summary: Get all Rating documents
      description: Retrieve a paginated list of Rating documents (read-only)
      operationId: getRatings
      security:
        - bearerAuth: []
      parameters:
        - name: offset
          in: header
          required: false
          description: Pagination offset (number of records to skip)
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: header
          required: false
          description: Pagination size (maximum records to return, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: name
          in: query
          required: false
          description: Optional name filter (supports partial matches, case-insensitive)
          schema:
            type: string
            example: my-Rating
        - name: sort_by
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum: [name, description]
            default: name
            example: name
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: asc
            example: asc
      responses:
        '200':
          description: Successfully retrieved Ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rating'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/Note:
    get:
      tags:
        - Note
      summary: Get Note documents for a resource
      description: Retrieve a paginated list of Note documents for a given resource (read-only)
      operationId: getNotes
      security:
        - bearerAuth: []
      parameters:
        - name: resource_id
          in: query
          required: true
          description: Required resource ID to get notes for
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
        - name: offset
          in: header
          required: false
          description: Pagination offset (number of records to skip)
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 0
        - name: size
          in: header
          required: false
          description: Pagination size (maximum records to return, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            example: 20
        - name: status
          in: query
          required: false
          description: Optional status filter
          schema:
            type: string
            enum: [active, archived]
        - name: sort_by
          in: query
          required: false
          description: Field to sort by
          schema:
            type: string
            enum: [created.at_time]
            default: created.at_time
            example: created.at_time
        - name: order
          in: query
          required: false
          description: Sort order
          schema:
            type: string
            enum: [asc, desc]
            default: desc
            example: desc
      responses:
        '200':
          description: Successfully retrieved Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/Profile/{ProfileId}:
    get:
      tags:
        - Profile
      summary: Get Profile by ProfileId
      description: Retrieve a specific Profile document by its ProfileId (read-only)
      operationId: getProfile
      security:
        - bearerAuth: []
      parameters:
        - name: ProfileId
          in: path
          required: true
          description: The Profile ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/Customer/{CustomerId}:
    get:
      tags:
        - Customer
      summary: Get Customer by CustomerId
      description: Retrieve a specific Customer document by its CustomerId (read-only)
      operationId: getCustomer
      security:
        - bearerAuth: []
      parameters:
        - name: CustomerId
          in: path
          required: true
          description: The Customer ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/Journey/{JourneyId}:
    get:
      tags:
        - Journey
      summary: Get Journey by JourneyId
      description: Retrieve a specific Journey document by its JourneyId (read-only)
      operationId: getJourney
      security:
        - bearerAuth: []
      parameters:
        - name: JourneyId
          in: path
          required: true
          description: The Journey ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Journey
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/Rating/{RatingId}:
    get:
      tags:
        - Rating
      summary: Get Rating by RatingId
      description: Retrieve a specific Rating document by its RatingId (read-only)
      operationId: getRating
      security:
        - bearerAuth: []
      parameters:
        - name: RatingId
          in: path
          required: true
          description: The Rating ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Rating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
