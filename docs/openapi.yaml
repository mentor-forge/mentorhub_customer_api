        '500':
          $ref: '#/components/responses/InternalError'
  /api/Note/{NoteId}:
    get:
      tags:
        - Note
      summary: Get Note by NoteId
      description: Retrieve a specific Note document by its NoteId (read-only)
      operationId: getNote
      security:
        - bearerAuth: []
      parameters:
        - name: NoteId
          in: path
          required: true
          description: The Note ID (MongoDB ObjectId)
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: 507f1f77bcf86cd799439011
      responses:
        '200':
          description: Successfully retrieved Note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by your identity provider (Developer Edition welcome flow for local dev).
        Include the token in the Authorization header: `Bearer <token>`

  parameters:
    ObjectId:
      name: controlId
      in: path
      required: true
      description: MongoDB ObjectId
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: 507f1f77bcf86cd799439011

  responses:
    BadRequest:
      description: Bad Request - Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized - Invalid or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: Unauthorized

    Breadcrumb:
      type: object
      description: Audit trail information
      additionalProperties: false
      required:
        - from_ip
        - by_user
        - at_time
        - correlation_id
      properties:
        from_ip:
          type: string
          format: ip
          description: HTTP request remote IP address
          example: 192.168.1.1
        at_time:
          type: string
          format: date-time
          description: Timestamp of the action
          example: "2024-01-15T10:00:00Z"
        by_user:
          type: string
          description: User ID who performed the action
          pattern: '^[^\s]{1,40}$'
          example: user-123
        correlation_id:
          type: string
          description: Logging correlation ID
          pattern: '^[^\s]{1,40}$'
          example: corr-abc123

    Event:
      type: object
      description: A meaningful event in the system.
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Event.
          pattern: '^[0-9a-fA-F]{24}$'
        context:
          type: object
          description: Context, additional properties allowed
          additionalProperties: true
          properties:
            profile_id:
              type: string
              description: Profile associated with the event
              pattern: '^[0-9a-fA-F]{24}$'
        created:
          $ref: '#/components/schemas/Breadcrumb'
        type:
          type: string
          description: The event type
          enum:
            - advanced
            - arrived
            - completed
            - encounter
            - external_received
            - fail
            - identity_provisioned
            - invite_accepted
            - invite_created
            - link
            - login
            - logout
            - note
            - notification_created
            - notification_dismissed
            - organization_enriched
            - payment_recorded
            - profile_redacted
            - started
            - subscription_changed

    EventInput:
      type: object
      description: Input for creating an Event document
      required:
        - type
      properties:
        type:
          type: string
          description: The event type
          enum:
            - advanced
            - arrived
            - completed
            - encounter
            - external_received
            - fail
            - identity_provisioned
            - invite_accepted
            - invite_created
            - link
            - login
            - logout
            - note
            - notification_created
            - notification_dismissed
            - organization_enriched
            - payment_recorded
            - profile_redacted
            - started
            - subscription_changed

    Profile:
      type: object
      description: Mentor Hub user profile document
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Profile.
          pattern: '^[0-9a-fA-F]{24}$'
        created:
          $ref: '#/components/schemas/Breadcrumb'
        customer_id:
          type: string
          description: the customer this profile is associated with
          pattern: '^[0-9a-fA-F]{24}$'
        description:
          type: string
          description: A Comment the user adds to their profile
          pattern: '^[^\t\n]{0,255}$'
        email:
          type: string
          description: The users email address
          pattern: '^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$'
        email_verified:
          type: boolean
          description: Has the user verified this email
        experience:
          type: array
          description: Work History - newest to oldest
          items:
            type: object
            description: Array item
            additionalProperties: false
            properties:
              company:
                type: string
                description: The Company Name
                pattern: '^[^\t\n]{0,255}$'
              roles:
                type: array
                description: The roles this person filled at this company
                items:
                  type: object
                  description: Array item
                  additionalProperties: false
                  properties:
                    description:
                      type: string
                      description: Description of the work, projects, responsibilities
                      maxLength: 4096
                    end:
                      type: string
                      format: date-time
                      description: End Date
                    start:
                      type: string
                      format: date-time
                      description: Start Date
                    technologies:
                      type: array
                      description: Technologies Used
                      items:
                        type: string
                        enum:
                          - CSS
                          - HTML
                          - Java
                          - MongoDB
                          - Other
                          - Python
                          - React
                          - TypeScript
                    title:
                      type: string
                      description: Te Job Title
                      pattern: '^[^\t\n]{0,255}$'
        full_name:
          type: string
          description: Display name from intake (distinct from IdP username)
          pattern: '^[^\t\n]{0,255}$'
        goals:
          type: array
          description: 'The goals set by a user '
          items:
            type: string
            description: Array item
            pattern: '^[^\t\n]{0,255}$'
        interests:
          type: array
          description: A list of topics this person is interested in
          items:
            type: string
            enum:
              - api
              - data
              - design
              - games
              - iot
              - robot
              - sre
              - ux
        mentor_id:
          type: string
          description: The _id of this persons Mentor
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
          description: The IDP Username used in JWT Claims
          pattern: '^[^\s]{1,40}$'
        roles:
          type: array
          description: The user roles this profile has
          items:
            type: string
            enum:
              - admin
              - coordinator
              - customer
              - mentee
              - mentor
        saved:
          $ref: '#/components/schemas/Breadcrumb'
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
            - provisioned
            - suspended

    Customer:
      type: object
      description: Paying sponsor organization (Organization) that funds mentoring for craftspeople; Path A Admin ingress provisions a Customer and Customer API enriches it.
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Customer.
          pattern: '^[0-9a-fA-F]{24}$'
        created:
          $ref: '#/components/schemas/Breadcrumb'
        description:
          type: string
          description: The description of the Customer.
          pattern: '^[^\t\n]{0,255}$'
        name:
          type: string
          description: The searchable name of the document
          pattern: '^[^\t\n]{0,255}$'
        saved:
          $ref: '#/components/schemas/Breadcrumb'
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived
            - provisioned
        stripe_customer_id:
          type: string
          description: Stripe Customer id (cus_…) for billing sync
          pattern: '^[^\t\n]{0,255}$'
        subscriptions:
          type: array
          description: Embedded purchase / entitlement subscriptions (business + Stripe sync)
          items:
            type: object
            description: Array item
            additionalProperties: false
            properties:
              cancel_at_period_end:
                type: boolean
                description: Stripe cancel_at_period_end — entitlement continues until current_period_end when status is still active
              current_period_end:
                type: string
                format: date-time
                description: End of the current Stripe billing period
              discount_code:
                type: string
                description: Redeemed discount code or empty string if none
                pattern: '^[^\t\n]{0,255}$'
              encounters_mo:
                type: number
                description: Encounters-per-month entitlement
                minimum: 0
                multipleOf: 1
              free_encounters_granted:
                type: number
                description: Free encounters granted from Discount at checkout (0 if none)
                minimum: 0
                multipleOf: 1
              free_encounters_remaining:
                type: number
                description: Remaining free encounters (starts at granted; decremented by Encounter domain)
                minimum: 0
                multipleOf: 1
              mentee_count:
                type: number
                description: Entitled mentee seats
                minimum: 0
                multipleOf: 1
              quantity:
                type: number
                description: Purchased seat quantity
                minimum: 0
                multipleOf: 1
              status:
                type: string
                description: Stripe subscription lifecycle status
                enum:
                  - active
                  - canceled
                  - past_due
              stripe_price_id:
                type: string
                description: Stripe Price id (price_…)
                pattern: '^[^\t\n]{0,255}$'
              stripe_subscription_id:
                type: string
                description: Stripe Subscription id (sub_…)
                pattern: '^[^\t\n]{0,255}$'
              subscription:
                type: string
                description: Plan identifier (matches Setting Product.subscription)
                pattern: '^[^\s]{1,40}$'
              total_cost:
                type: number
                description: quantity x unit_cost (or Stripe-reconciled) in minor units
                minimum: 0
                multipleOf: 1
              unit_cost:
                type: number
                description: Unit price at purchase in minor units (snapshot of Product.unit_price)
                minimum: 0
                multipleOf: 1

    Journey:
      type: object
      description: A users progress on their learning path
      additionalProperties: false
      properties:
        _id:
          type: string
          description: The unique identifier for the Journey.
          pattern: '^[0-9a-fA-F]{24}$'
        created:
          $ref: '#/components/schemas/Breadcrumb'
        description:
          type: string
          description: A description of this journey
          pattern: '^[^\t\n]{0,255}$'
        modules:
          type: array
          description: The modules that make up this journey
          items:
            type: object
            description: Array item
            additionalProperties: false
            properties:
              description:
                type: string
                description: The Description of this Module
                pattern: '^[^\t\n]{0,255}$'
              name:
                type: string
                description: The Module Name
                pattern: '^[^\s]{1,40}$'
              topics:
                type: array
                description: The Topics of this Module
                items:
                  type: object
                  description: Array item
                  additionalProperties: false
                  properties:
                    description:
                      type: string
                      description: A Description of the Topic
                      pattern: '^[^\t\n]{0,255}$'
                    name:
                      type: string
                      description: The Topic Name
                      pattern: '^[^\s]{1,40}$'
                    resources:
                      type: array
                      description: The Resources _ID's for this Topic
                      items:
                        type: string
                        description: Array item
                        pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
          description: The Journey Name
          pattern: '^[^\s]{1,40}$'
        now:
          type: array
          description: The resource _id's the person is currently working on
          items:
            type: object
            description: Array item
            additionalProperties: false
            properties:
              added:
                type: string
                format: date-time
                description: When the resource was added to the Now scope
              resource_id:
                type: string
                description: The Resource ID
                pattern: '^[0-9a-fA-F]{24}$'
              started:
                type: string
                format: date-time
                description: The first time the link was followed
              used:
                type: number
                description: The count of times the link was followed
                minimum: 0
                multipleOf: 1
        profile_id:
          type: string
          description: The Profile ID of the owner of this journey
          pattern: '^[0-9a-fA-F]{24}$'
        saved:
          $ref: '#/components/schemas/Breadcrumb'
        status:
          type: string
          description: Status of the document
          enum:
            - active
            - archived

